manifestVersion: 1
name: "@shrug/borgmatic"
version: "2026.11.19.1"
description: "Host agent for borgmatic backups over SSH. Version-aware config rendering (commands: on borgmatic ≥2.0, before_backup: on 1.8–1.9), apply-gated on `borgmatic config validate`, with install/keygen/timer convergence, on-demand backup/prune/compact/check, and queryable listArchives/info/status. Every mutation is audited on both success and failure."

repository: https://github.com/shrugpw/swamp-borgmatic

additionalFiles:
  - README.md
  - LICENSE.txt

models:
  - borgmatic.ts

# Empty platforms == universal. The model shells out to the host `ssh` binary
# (present on linux and darwin alike); the borgmatic/borg/sqlite/systemd tooling
# it drives lives on the *remote* target host, not where swamp runs.
platforms: []

labels:
  - borgmatic
  - borg
  - backup
  - restore
  - systemd
